server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API requests to backend. Adjust target to your API host (http(s)://host:port).
  location /api/ {
    proxy_pass http://your-api.example.com/api/; //заменитьна реальный бэкэнд апи
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  # Serve static files, fallback to index.html for SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: increase body size for file uploads if reviews allow media
  client_max_body_size 50m;
}
